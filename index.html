<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bilheteira Plebeus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: theatre box-office console — events rail | seat map with stage | booking & door panel */
:root{
  --bg:#f2f1f4; --surface:#ffffff; --sunk:#e9e7ed; --ink:#1c1922; --muted:#6a6474; --line:#dcd8e2;
  --velvet:#9a1d3c; --velvet-ink:#ffffff; --brass:#a87414; --acc:#2a62a6; --ok:#2e7a4d; --warn:#b4531a;
  --seat-free:#ffffff; --seat-line:#b9b3c3;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --seat:27px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141218; --surface:#1e1b24; --sunk:#26222d; --ink:#ece8f1; --muted:#9e97aa; --line:#34303c;
  --velvet:#d24a6d; --velvet-ink:#1a0a10; --brass:#d8a33f; --acc:#6ea6ea; --ok:#56b582; --warn:#e08a4f;
  --seat-free:#2a2631; --seat-line:#4d4757; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141218; --surface:#1e1b24; --sunk:#26222d; --ink:#ece8f1; --muted:#9e97aa; --line:#34303c;
  --velvet:#d24a6d; --velvet-ink:#1a0a10; --brass:#d8a33f; --acc:#6ea6ea; --ok:#56b582; --warn:#e08a4f;
  --seat-free:#2a2631; --seat-line:#4d4757; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 auto 14px;max-width:1500px}
.top h1{font-size:24px;font-weight:700}
.top h1 span{color:var(--velvet)}
.top .sub{color:var(--muted)}
.banner{max-width:1500px;margin:0 auto 12px;padding:8px 12px;border-radius:8px;background:var(--sunk);color:var(--muted);font-size:13px}
.banner[hidden]{display:none}

.app{display:grid;gap:16px;max-width:1500px;margin:0 auto;grid-template-columns:minmax(0,1fr)}
@media (min-width:1150px){ .app{grid-template-columns:230px minmax(0,1fr) 350px;align-items:start} }

/* Events rail */
.rail{display:flex;flex-direction:column;gap:10px;min-width:0}
.rail-head{display:flex;justify-content:space-between;align-items:center}
.events{display:flex;flex-direction:column;gap:6px}
@media (max-width:1149px){ .events{flex-direction:row;overflow-x:auto;padding-bottom:4px} .ev{min-width:200px} }
.ev{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:transparent}
.ev:hover{background:var(--sunk)}
.ev.on{background:var(--surface);border-color:var(--line)}
.ev.past{opacity:.6}
.ev .d{display:flex;flex-direction:column;align-items:center;justify-content:center;width:42px;height:44px;border-radius:6px;background:var(--sunk);flex:none;line-height:1}
.ev.on .d{background:var(--velvet);color:var(--velvet-ink)}
.ev .d b{font-family:var(--f-display);font-size:18px}
.ev .d small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.ev .t{min-width:0}
.ev .t strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .t span{color:var(--muted);font-size:12px}
.rail .group{margin-top:6px}

/* Cards and controls */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:7px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--velvet);border-color:var(--velvet);color:var(--velvet-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--velvet);border-color:var(--velvet)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 9px;width:100%}
.field textarea{resize:vertical;min-height:54px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}
.muted{color:var(--muted)}
.small{font-size:12px}

/* Main / header */
.main{display:flex;flex-direction:column;gap:12px;min-width:0}
.evhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.evhead h2{font-size:22px;font-weight:700}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.occ{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.occ i{display:block;height:100%}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .seat{cursor:default;width:15px;height:15px}

/* Seat map */
.map-scroll{overflow-x:auto;padding-bottom:6px}
.map{min-width:max-content;margin:0 auto;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;user-select:none;-webkit-user-select:none}
.stage{width:min(70%,520px);min-width:240px;height:34px;margin-bottom:18px;border-radius:0 0 50% 50% / 0 0 100% 100%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;letter-spacing:.4em;font-size:12px}
.zone-label{display:flex;align-items:center;gap:10px;width:100%;margin:16px 0 6px;color:var(--muted)}
.zone-label::before,.zone-label::after{content:"";flex:1;border-top:1px dashed var(--line)}
.zone-label.first{margin-top:0}
.srow{display:flex;align-items:center;justify-content:center;gap:3px}
.rl{width:20px;text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.gap{width:var(--seat);height:var(--seat);flex:none}
.seat{width:var(--seat);height:var(--seat);border-radius:6px 6px 3px 3px;border:1.5px solid var(--seat-line);background:var(--seat-free);padding:0;position:relative;flex:none;transition:transform .08s;font:500 10px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.seat.is-booked,.seat.is-in{color:var(--velvet-ink)}
.seat.is-sel{color:var(--bg)}
.legend .seat{font-size:0}
.seat:hover{transform:translateY(-1px)}
.seat.t-acc{border-color:var(--acc);border-width:2px}
.seat.t-acc::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--acc)}
.seat.t-vip{border-color:var(--brass);border-width:2px}
.seat.t-vip::after{content:"";position:absolute;left:2px;right:2px;top:2px;height:3px;border-radius:2px;background:var(--brass)}
.seat.is-booked{background:var(--velvet);border-color:var(--velvet)}
.seat.is-in{background:var(--ok);border-color:var(--ok)}
.seat.is-booked::after,.seat.is-in::after{opacity:.7;background:var(--surface)}
.seat.is-sel{background:var(--ink);border-color:var(--ink)}
.seat.is-sel::after{background:var(--bg)}
.seat.is-blocked{background:repeating-linear-gradient(45deg,var(--seat-line) 0 2px,transparent 2px 5px);border-color:var(--seat-line);cursor:not-allowed}
.seat.is-hl{outline:2.5px solid var(--brass);outline-offset:1px;z-index:1}
.seat.is-dim{opacity:.35}
.mode-block .seat:not(.is-booked):not(.is-in),.mode-types .seat{cursor:crosshair}
@media (prefers-reduced-motion: reduce){ .seat{transition:none} .seat:hover{transform:none} }

/* Panel */
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--velvet)}
.tabs .count{font-family:var(--f-mono);font-size:11px;background:var(--sunk);padding:1px 6px;border-radius:9px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:2px 7px;border-radius:5px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-head h3{font-size:16px;font-weight:700}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px}
.status.in{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.status.out{background:var(--sunk);color:var(--muted)}
.list{display:flex;flex-direction:column}
.bk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.bk:last-child{border-bottom:0}
.bk .who{background:none;border:0;padding:0;text-align:left;min-width:0}
.bk .who strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .who span{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.bk.in .who strong{color:var(--ok)}
.empty{padding:18px 6px;text-align:center;color:var(--muted)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--velvet) 10%,transparent)}
.confirm p{margin:0;flex:1 1 160px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:20}
.toast[hidden]{display:none}
.overlay{position:fixed;inset:0;background:rgba(10,8,14,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:15}
.overlay[hidden]{display:none}
.overlay .card{width:min(520px,100%);max-height:90vh;overflow:auto}
.zone-cfg{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.check{display:flex;align-items:center;gap:6px;font-size:13px}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.evlogo{height:44px;max-width:120px;object-fit:contain;background:#fff;border-radius:6px;padding:3px;border:1px solid var(--line)}
.evtitle{display:flex;gap:12px;align-items:center;min-width:0}
.tk-grid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:14px;background:var(--sunk);border-radius:8px;max-height:52vh;overflow:auto}
.tk-grid img{width:190px;height:auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);image-rendering:auto}
.tk-grid.w58 img{width:140px}
.scan-in input{font:500 18px var(--f-mono);letter-spacing:.06em;padding:12px}
.verdict{border-radius:10px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
.verdict .ic{grid-row:span 2;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 24px var(--f-display);color:#fff}
.verdict b{font:700 18px var(--f-display)}
.verdict span{font-size:13px}
.verdict.ok{background:color-mix(in srgb,var(--ok) 15%,transparent)} .verdict.ok .ic{background:var(--ok)}
.verdict.used{background:color-mix(in srgb,var(--warn) 16%,transparent)} .verdict.used .ic{background:var(--warn)}
.verdict.bad{background:color-mix(in srgb,var(--velvet) 13%,transparent)} .verdict.bad .ic{background:var(--velvet)}
.log{display:flex;flex-direction:column;font-size:12px}
.log div{display:grid;grid-template-columns:44px 14px minmax(0,1fr);gap:6px;padding:4px 0;border-bottom:1px solid var(--line)}
.log div:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:5px}
.dot.ok{background:var(--ok)} .dot.used{background:var(--warn)} .dot.bad{background:var(--velvet)}

/* standalone extras */
body{margin:0}
.top .spacer{flex:1}
.who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.gate[hidden]{display:none}
.gate .card{width:min(400px,100%)}
.gate h2{font-size:24px}
.gate h2 span{color:var(--velvet)}
.staff-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.staff-row span{overflow:hidden;text-overflow:ellipsis}
.role-pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:9px;background:var(--sunk);color:var(--ink)}
.role-pill.admin{background:var(--velvet);color:var(--velvet-ink)}
body.role-user #mapCard{display:none}
@media (min-width:1150px){ body.role-user .app{grid-template-columns:230px minmax(0,1fr) minmax(0,1.2fr)} }
.staff-row select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 6px}
</style>
</head>
<body>

<header class="top">
  <h1>Bilheteira <span>Plebeus</span></h1>
  <span class="sub">Reservas e lugares do auditório</span>
  <span class="spacer"></span>
  <div class="who" id="who"></div>
</header>
<div class="banner" id="banner" hidden></div>

<div class="app">
  <aside class="rail">
    <div class="rail-head"><span class="label">Eventos</span><button class="btn sm" id="newEventBtn" type="button">+ Novo evento</button></div>
    <div id="newEventBox"></div>
    <div id="eventsList"></div>
  </aside>

  <section class="main">
    <div class="card" id="evHeader"></div>
    <div class="card" id="mapCard">
      <div class="toolbar">
        <div class="row-btns" id="modeBar"></div>
        <div class="legend">
          <span><i class="seat"></i>Livre</span>
          <span><i class="seat is-sel"></i>Selecionado</span>
          <span><i class="seat is-booked"></i>Reservado</span>
          <span><i class="seat is-in"></i>Entrou</span>
          <span><i class="seat is-blocked"></i>Bloqueado</span>
          <span><i class="seat t-acc"></i>Mob. reduzida</span>
          <span><i class="seat t-vip"></i>VIP</span>
        </div>
      </div>
      <div class="map-scroll"><div class="map" id="map"></div></div>
      <p class="small muted" id="mapHint" style="margin:0"></p>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs" id="tabs"></div>
    <div id="panelBody" class="panel"></div>
  </aside>
</div>

<div class="overlay" id="venueOverlay" hidden></div>
<div class="overlay" id="ticketOverlay" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="overlay" id="staffOverlay" hidden></div>
<div class="gate" id="gate"><div class="card" id="gateCard"><p class="muted" style="margin:0">A abrir…</p></div></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

/* ---------- Auto allocation ---------- */
function segmentsFor(type, zonePref, exclude) {
  const blocked = blockedSet(), segs = [];
  const ok = (s) => {
    if (S.seatOwner.has(s.id) || blocked.has(s.id) || exclude.has(s.id)) return false;
    const t = seatType(s.id);
    if (type === "vip") return t === "vip";
    if (type === "acc") return t === "acc" || t === "normal";
    return t === "normal";
  };
  for (const z of S.layout.zones) {
    if (zonePref !== "any" && z.id !== zonePref) continue;
    for (const row of z.rowsArr) {
      let cur = [], prev = null;
      for (const s of row.seats) {
        const good = ok(s);
        if (!good || (prev && (s.seg !== prev.seg || s.pos !== prev.pos + 1))) { if (cur.length) segs.push({ z, seats: cur }); cur = []; }
        if (good) cur.push(s);
        prev = s;
      }
      if (cur.length) segs.push({ z, seats: cur });
    }
  }
  return segs;
}
function windowScore(z, w) {
  const ideal = Math.round((z.rowsArr.length - 1) * 0.4), len = w[0].rowLen;
  const mid = (w[0].pos + w[w.length - 1].pos) / 2, centre = (len - 1) / 2;
  return Math.abs(w[0].ri - ideal) + Math.abs(mid - centre) / len * 8 + z.zi * 4;
}
function bestWindow(segs, n, needAcc) {
  let best = null;
  for (const sg of segs) {
    for (let i = 0; i + n <= sg.seats.length; i++) {
      const w = sg.seats.slice(i, i + n);
      if (needAcc && !w.some(s => seatType(s.id) === "acc")) continue;
      const sc = windowScore(sg.z, w);
      if (!best || sc < best.sc) best = { sc, w };
    }
  }
  return best;
}
function suggest(n, zonePref, type) {
  const one = bestWindow(segmentsFor(type, zonePref, new Set()), n, type === "acc");
  if (one) return { ids: one.w.map(s => s.id), split: false };
  const picked = new Set(); let remaining = n, guard = 0;
  while (remaining > 0 && guard++ < 200) {
    const segs = segmentsFor(type, zonePref, picked);
    if (!segs.length) break;
    const k = Math.min(remaining, Math.max(...segs.map(s => s.seats.length)));
    const b = bestWindow(segs, k, false);
    if (!b) break;
    b.w.forEach(s => picked.add(s.id)); remaining -= k;
  }
  return { ids: [...picked], split: true };
}

async function saveVenue() {
  const w = $("vz-warn"); let zones;
  try {
    const seen = new Set();
    zones = S.venue.zones.map(z => {
      const rows = $(`vz-${z.id}-rows`).value.split(/\n/).map(l => l.trim()).filter(Boolean).map(l => {
        const m = l.match(/^([A-Za-z]{1,3})\s*:\s*(.+)$/);
        if (!m) throw new Error(`a linha "${l}" deve começar pela letra da fila e dois pontos`);
        const label = m[1].toUpperCase();
        if (seen.has(z.id + label)) throw new Error(`a fila ${label} aparece duas vezes em ${z.name}`);
        seen.add(z.id + label);
        try { if (!parseRow(m[2]).some(n => n != null)) throw new Error("não tem lugares"); } catch (e) { throw new Error(`fila ${label}: ${e.message}`); }
        return { label, items: m[2].trim().replace(/\s+/g, " ") };
      });
      return { id: z.id, name: $(`vz-${z.id}-name`).value.trim() || z.name, rows };
    });
  } catch (e) { w.textContent = "Não foi possível ler a planta: " + e.message + "."; return; }
  const lay = buildLayout({ zones });
  const orphan = []; S.bookings.forEach(b => (b.seats || []).forEach(id => { if (!lay.idx.has(id)) orphan.push(id); }));
  if (orphan.length && !saveVenue.confirmed) { w.textContent = `Atenção: ${orphan.length} lugares reservados neste evento deixariam de existir. Clique em Guardar planta outra vez para confirmar.`; saveVenue.confirmed = true; return; }
  saveVenue.confirmed = false;
  S.venue = { ...S.venue, zones };
  $("venueOverlay").hidden = true; renderAll();
  await run(() => S.store.saveVenue(S.venue), "Planta da sala guardada.");
}

async function ensureTickets(ev, b) {

  const have = new Map((b.tickets || []).filter(t => seats.includes(t.s)).map(t => [t.s, t.c]));

  return tickets;
}

}

    if (other) res = { kind: "bad", title: "Bilhete de outro evento", detail: `${other.name} · ${fmtDate(other.date, { day: "numeric", month: "long" })}${other.time ? " · " + other.time : ""}` };

  }

}

function lumOf(img, rot, maxDim) {

  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d");
  if (rot) { x.translate(w, 0); x.rotate(Math.PI / 2); }
  x.drawImage(img, 0, 0, w0, h0);
  const d = x.getImageData(0, 0, w, h).data, lum = new Uint8ClampedArray(w * h);
  for (let i = 0, j = 0; j < lum.length; i += 4, j++) lum[j] = (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8;
  return { lum, w, h };
}
async function decodePhoto(file) {

    if ("BarcodeDetector" in window) {

async function exportCsv(kind) {

    S.bookings.slice().sort((a, b) => a.name.localeCompare(b.name, "pt")).forEach(b => { const k = enteredCount(b), n = (b.seats || []).length; rows.push([b.name, b.contact, n, formatSeats(b.seats || []), b.notes, k === n ? "Sim" : k ? `${k}/${n}` : "Não", b.checkedAt ? new Date(b.checkedAt).toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" }) : ""]); });

      rows.push([z.name, s.row, pad(s.n), TYPE_NAMES[seatType(s.id)], b ? (seatIn(b, s.id) ? "Entrou" : "Reservado") : blocked.has(s.id) ? "Bloqueado" : "Livre", b ? b.name : "", b ? b.contact : "", tk ? tk.c : ""]);

function pickDefaultEvent() {
  if (S.eventId && S.events.some(e => e.id === S.eventId)) return S.eventId;
  const t = todayISO(); const up = S.events.find(e => (e.date || "") >= t);
  return up ? up.id : (S.events.length ? S.events[S.events.length - 1].id : null);
}
function start(store) {
  S.store = store;
  store.onVenue((v) => {
    if (v && Array.isArray(v.zones) && v.zones.length && v.zones.every(z => Array.isArray(z.rows))) {
      if (!S.pendingVenue) S.venue = { zones: v.zones, types: v.types || {} };
    }
    renderAll();
  }, (err) => toast(errMsg(err)));
  store.onEvents((list) => {
    S.events = list.sort((a, b) => ((a.date || "") + (a.time || "")).localeCompare((b.date || "") + (b.time || "")));
    S.events.forEach((e, i) => { if (S.pendingBlocked[e.id]) S.events[i] = { ...e, blocked: S.pendingBlocked[e.id] }; });
    S.ready = true;
    const want = pickDefaultEvent();
    if (want !== S.eventId || !S.unsubB) selectEvent(want); else renderAll();
  }, (err) => toast(errMsg(err)));
}

  });
  o.querySelectorAll("[data-staff-del]").forEach(b => b.onclick = async () => {
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Confirmar remoção"; b.classList.add("danger"); return; }
    const x = await sb.from("staff").delete().eq("email", b.dataset.staffDel);
    if (x.error) toast("Não foi possível remover."); else renderStaff();
  });
}
document.addEventListener("click", (e) => { if (e.target.closest('[data-act="staff-open"]')) renderStaff(); });

renderAll();
(async () => {
  if (!sb) {
    S.demo = true; $("gate").hidden = true;
    const b = $("banner"); b.textContent = "Modo de demonstração: falta configurar a ligação à base de dados. As alterações não ficam guardadas."; b.hidden = false;
    start(makeMemStore(DEMO)); return;
  }
  const { data } = await sb.auth.getSession();
  if (data && data.session) enter(data.session); else renderLogin();
})();
})();
</script>
