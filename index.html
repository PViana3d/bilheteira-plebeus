<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bilheteira União Académica de Avintes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: theatre box-office console — events rail | seat map with stage | booking & door panel */
:root{
  --bg:#f2f1f4; --surface:#ffffff; --sunk:#e9e7ed; --ink:#1c1922; --muted:#6a6474; --line:#dcd8e2;
  --velvet:#9a1d3c; --velvet-ink:#ffffff; --brass:#a87414; --acc:#2a62a6; --ok:#2e7a4d; --warn:#b4531a;
  --seat-free:#ffffff; --seat-line:#b9b3c3;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --seat:27px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141218; --surface:#1e1b24; --sunk:#26222d; --ink:#ece8f1; --muted:#9e97aa; --line:#34303c;
  --velvet:#d24a6d; --velvet-ink:#1a0a10; --brass:#d8a33f; --acc:#6ea6ea; --ok:#56b582; --warn:#e08a4f;
  --seat-free:#2a2631; --seat-line:#4d4757; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141218; --surface:#1e1b24; --sunk:#26222d; --ink:#ece8f1; --muted:#9e97aa; --line:#34303c;
  --velvet:#d24a6d; --velvet-ink:#1a0a10; --brass:#d8a33f; --acc:#6ea6ea; --ok:#56b582; --warn:#e08a4f;
  --seat-free:#2a2631; --seat-line:#4d4757; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 auto 14px;max-width:1500px}
.top h1{font-size:24px;font-weight:700}
.top h1 span{color:var(--velvet)}
.top .sub{color:var(--muted)}
.banner{max-width:1500px;margin:0 auto 12px;padding:8px 12px;border-radius:8px;background:var(--sunk);color:var(--muted);font-size:13px}
.banner[hidden]{display:none}

.app{display:grid;gap:16px;max-width:1500px;margin:0 auto;grid-template-columns:minmax(0,1fr)}
@media (min-width:1150px){ .app{grid-template-columns:230px minmax(0,1fr) 350px;align-items:start} }

/* Events rail */
.rail{display:flex;flex-direction:column;gap:10px;min-width:0}
.rail-head{display:flex;justify-content:space-between;align-items:center}
.events{display:flex;flex-direction:column;gap:6px}
@media (max-width:1149px){ .events{flex-direction:row;overflow-x:auto;padding-bottom:4px} .ev{min-width:200px} }
.ev{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:transparent}
.ev:hover{background:var(--sunk)}
.ev.on{background:var(--surface);border-color:var(--line)}
.ev.past{opacity:.6}
.ev .d{display:flex;flex-direction:column;align-items:center;justify-content:center;width:42px;height:44px;border-radius:6px;background:var(--sunk);flex:none;line-height:1}
.ev.on .d{background:var(--velvet);color:var(--velvet-ink)}
.ev .d b{font-family:var(--f-display);font-size:18px}
.ev .d small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.ev .t{min-width:0}
.ev .t strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .t span{color:var(--muted);font-size:12px}
.rail .group{margin-top:6px}

/* Cards and controls */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:7px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--velvet);border-color:var(--velvet);color:var(--velvet-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--velvet);border-color:var(--velvet)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 9px;width:100%}
.field textarea{resize:vertical;min-height:54px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}
.muted{color:var(--muted)}
.small{font-size:12px}

/* Main / header */
.main{display:flex;flex-direction:column;gap:12px;min-width:0}
.evhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.evhead h2{font-size:22px;font-weight:700}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.occ{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.occ i{display:block;height:100%}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .seat{cursor:default;width:15px;height:15px}

/* Seat map */
.map-scroll{overflow-x:auto;padding-bottom:6px}
.map{min-width:max-content;margin:0 auto;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;user-select:none;-webkit-user-select:none}
.stage{width:min(70%,520px);min-width:240px;height:34px;margin-bottom:18px;border-radius:0 0 50% 50% / 0 0 100% 100%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;letter-spacing:.4em;font-size:12px}
.zone-label{display:flex;align-items:center;gap:10px;width:100%;margin:16px 0 6px;color:var(--muted)}
.zone-label::before,.zone-label::after{content:"";flex:1;border-top:1px dashed var(--line)}
.zone-label.first{margin-top:0}
.srow{display:flex;align-items:center;justify-content:center;gap:3px}
.rl{width:20px;text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.gap{width:var(--seat);height:var(--seat);flex:none}
.seat{width:var(--seat);height:var(--seat);border-radius:6px 6px 3px 3px;border:1.5px solid var(--seat-line);background:var(--seat-free);padding:0;position:relative;flex:none;transition:transform .08s;font:500 10px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.seat.is-booked,.seat.is-in{color:var(--velvet-ink)}
.seat.is-sel{color:var(--bg)}
.legend .seat{font-size:0}
.seat:hover{transform:translateY(-1px)}
.seat.t-acc{border-color:var(--acc);border-width:2px}
.seat.t-acc::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--acc)}
.seat.t-vip{border-color:var(--brass);border-width:2px}
.seat.t-vip::after{content:"";position:absolute;left:2px;right:2px;top:2px;height:3px;border-radius:2px;background:var(--brass)}
.seat.is-booked{background:var(--velvet);border-color:var(--velvet)}
.seat.is-in{background:var(--ok);border-color:var(--ok)}
.seat.is-booked::after,.seat.is-in::after{opacity:.7;background:var(--surface)}
.seat.is-sel{background:var(--ink);border-color:var(--ink)}
.seat.is-sel::after{background:var(--bg)}
.seat.is-blocked{background:repeating-linear-gradient(45deg,var(--seat-line) 0 2px,transparent 2px 5px);border-color:var(--seat-line);cursor:not-allowed}
.seat.is-hl{outline:2.5px solid var(--brass);outline-offset:1px;z-index:1}
.seat.is-dim{opacity:.35}
.mode-block .seat:not(.is-booked):not(.is-in),.mode-types .seat{cursor:crosshair}
@media (prefers-reduced-motion: reduce){ .seat{transition:none} .seat:hover{transform:none} }

/* Panel */
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:8px 10px;white-space:nowrap;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--velvet)}
.tabs .count{font-family:var(--f-mono);font-size:11px;background:var(--sunk);padding:1px 6px;border-radius:9px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:2px 7px;border-radius:5px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-head h3{font-size:16px;font-weight:700}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px}
.status.in{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.status.out{background:var(--sunk);color:var(--muted)}
.list{display:flex;flex-direction:column}
.bk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.bk:last-child{border-bottom:0}
.bk .who{background:none;border:0;padding:0;text-align:left;min-width:0}
.bk .who strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .who span{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.bk.in .who strong{color:var(--ok)}
.empty{padding:18px 6px;text-align:center;color:var(--muted)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--velvet) 10%,transparent)}
.confirm p{margin:0;flex:1 1 160px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:20}
.toast[hidden]{display:none}
.overlay{position:fixed;inset:0;background:rgba(10,8,14,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:15}
.overlay[hidden]{display:none}
.overlay .card{width:min(520px,100%);max-height:90vh;overflow:auto}
.zone-cfg{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.check{display:flex;align-items:center;gap:6px;font-size:13px}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.evlogo{height:44px;max-width:120px;object-fit:contain;background:#fff;border-radius:6px;padding:3px;border:1px solid var(--line)}
.evtitle{display:flex;gap:12px;align-items:center;min-width:0}
.tk-grid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:14px;background:var(--sunk);border-radius:8px;max-height:52vh;overflow:auto}
.tk-grid img{width:190px;height:auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);image-rendering:auto}
.tk-grid.w58 img{width:140px}
.scan-in input{font:500 18px var(--f-mono);letter-spacing:.06em;padding:12px}
.verdict{border-radius:10px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
.verdict .ic{grid-row:span 2;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 24px var(--f-display);color:#fff}
.verdict b{font:700 18px var(--f-display)}
.verdict span{font-size:13px}
.verdict.ok{background:color-mix(in srgb,var(--ok) 15%,transparent)} .verdict.ok .ic{background:var(--ok)}
.verdict.used{background:color-mix(in srgb,var(--warn) 16%,transparent)} .verdict.used .ic{background:var(--warn)}
.verdict.bad{background:color-mix(in srgb,var(--velvet) 13%,transparent)} .verdict.bad .ic{background:var(--velvet)}
.log{display:flex;flex-direction:column;font-size:12px}
.log div{display:grid;grid-template-columns:44px 14px minmax(0,1fr);gap:6px;padding:4px 0;border-bottom:1px solid var(--line)}
.log div:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:5px}
.dot.ok{background:var(--ok)} .dot.used{background:var(--warn)} .dot.bad{background:var(--velvet)} .dot.due{background:var(--warn)}

/* standalone extras */
body{margin:0}
.top .spacer{flex:1}
.whobar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.gate[hidden]{display:none}
.gate .card{width:min(400px,100%)}
.gate h2{font-size:24px}
.gate h2 span{color:var(--velvet)}
.staff-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.staff-row span{overflow:hidden;text-overflow:ellipsis}
.role-pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:9px;background:var(--sunk);color:var(--ink)}
.role-pill.admin{background:var(--velvet);color:var(--velvet-ink)}
body.role-user #mapCard{display:none}
@media (min-width:1150px){ body.role-user .app{grid-template-columns:230px minmax(0,1fr) minmax(0,1.2fr)} }
.price-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:4px}
@media (min-width:700px){ .price-grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
.moneybox{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:8px;background:var(--sunk)}
.moneybox .total{font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.seatcats{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.seatcat{display:grid;grid-template-columns:minmax(0,1fr) auto 72px;gap:8px;align-items:center;font-size:13px}
.seatcat select,.payform select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.neg{color:var(--velvet)} .pos{color:var(--ok)}
.sums{display:flex;gap:14px;flex-wrap:wrap}
.sums div{display:flex;flex-direction:column}
.sums span,.kpis span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.sums b{font:700 17px var(--f-display);font-variant-numeric:tabular-nums}
.is-due b{color:var(--warn)} .is-over b{color:var(--acc)} .is-neg b{color:var(--velvet)} .is-pos b{color:var(--ok)}
.paylist{display:flex;flex-direction:column;font-size:12px}
.paylist>div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.paylist>div:last-child{border-bottom:0}
.payform{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.warn{color:var(--warn)}
.linkbtn{background:none;border:0;padding:0;color:var(--acc);text-decoration:underline;font:inherit;cursor:pointer}
.pchip{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;font-family:var(--f-body)}
.pchip.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pchip.due{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pchip.free{background:var(--sunk);color:var(--muted)}
.bk .who .pchip{font-family:var(--f-body);font-size:11px;margin-left:6px}
.bk .who .pchip.ok{color:var(--ok)} .bk .who .pchip.due{color:var(--warn)} .bk .who .pchip.free{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.kpis div{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;background:var(--sunk);min-width:0}
.kpis b{font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
.kpis small{font-size:11px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl th.num{text-align:right}
.tbl tr.tot td{font-weight:700;border-bottom:0}
.xrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.xrow strong{display:block}
.cash-on{background:color-mix(in srgb,var(--ok) 16%,transparent)!important;color:var(--ok)!important}
.verdict.due{background:color-mix(in srgb,var(--warn) 16%,transparent)} .verdict.due .ic{background:var(--warn)}
.staff-row select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 6px}
</style>
</head>
<body>

<header class="top">
  <h1>Bilheteira <span>União Académica de Avintes</span></h1>
  <span class="sub">Reservas e lugares do auditório</span>
  <span class="spacer"></span>
  <div class="whobar" id="who"></div>
</header>
<div class="banner" id="banner" hidden></div>

<div class="app">
  <aside class="rail">
    <div class="rail-head"><span class="label">Eventos</span><button class="btn sm" id="newEventBtn" type="button">+ Novo evento</button></div>
    <div id="newEventBox"></div>
    <div id="eventsList"></div>
  </aside>

  <section class="main">
    <div class="card" id="evHeader"></div>
    <div class="card" id="mapCard">
      <div class="toolbar">
        <div class="row-btns" id="modeBar"></div>
        <div class="legend">
          <span><i class="seat"></i>Livre</span>
          <span><i class="seat is-sel"></i>Selecionado</span>
          <span><i class="seat is-booked"></i>Reservado</span>
          <span><i class="seat is-in"></i>Entrou</span>
          <span><i class="seat is-blocked"></i>Bloqueado</span>
          <span><i class="seat t-acc"></i>Mob. reduzida</span>
          <span><i class="seat t-vip"></i>VIP</span>
        </div>
      </div>
      <div class="map-scroll"><div class="map" id="map"></div></div>
      <p class="small muted" id="mapHint" style="margin:0"></p>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs" id="tabs"></div>
    <div id="panelBody" class="panel"></div>
  </aside>
</div>

<div class="overlay" id="venueOverlay" hidden></div>
<div class="overlay" id="ticketOverlay" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="overlay" id="staffOverlay" hidden></div>
<div class="overlay" id="cashOverlay" hidden></div>
<div class="overlay" id="repOverlay" hidden></div>
<div class="gate" id="gate"><div class="card" id="gateCard"><p class="muted" style="margin:0">A abrir…</p></div></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
"use strict";

/* Row syntax: "18-2:2" = 18 to 2 in steps of 2, "20-1" = 20 to 1, "7" = single seat, "_" = empty slot (aisle). Listed left to right as seen from the stage plan. */
function parseRow(str) {
  const out = [];
  for (const tok of String(str || "").trim().split(/\s+/).filter(Boolean)) {
    if (/^_+$/.test(tok)) { for (let i = 0; i < tok.length; i++) out.push(null); continue; }
    const m = tok.match(/^(\d{1,3})(?:-(\d{1,3})(?::(\d{1,2}))?)?$/);
    if (!m) throw new Error(`"${tok}" não é válido`);
    const a = +m[1], b = m[2] != null ? +m[2] : a, step = Math.max(1, +(m[3] || 1));
    if (a <= b) for (let n = a; n <= b; n += step) out.push(n); else for (let n = a; n >= b; n -= step) out.push(n);
  }
  return out;
}
function buildLayout(venue) {
  const zones = [], idx = new Map();
  venue.zones.forEach((z, zi) => {
    const rowsArr = [];
    (z.rows || []).forEach((r, ri) => {
      const slots = parseRow(r.items), seats = [];
      let seg = 0, prevGap = false;
      slots.forEach((n, pos) => {
        if (n == null) { if (!prevGap) seg++; prevGap = true; return; }
        prevGap = false;
        const s = { id: `${z.id}-${r.label}-${n}`, zone: z.id, zi, zoneName: z.name, row: r.label, ri, n, pos, seg, rowLen: slots.length };
        if (idx.has(s.id)) return;
        seats.push(s); idx.set(s.id, s);
      });
      rowsArr.push({ label: r.label, slots, seats });
    });
    zones.push({ ...z, zi, rowsArr });
  });

}

function formatSeats(ids) {
  const byZone = new Map();
  ids.map(id => S.layout.idx.get(id) || (() => { const p = id.split("-"); return { zone: p[0], zi: 99, zoneName: "?", row: p[1], ri: 99, n: +p[2], pos: +p[2], seg: 0 }; })())
    .sort((a, b) => a.zi - b.zi || a.ri - b.ri || a.pos - b.pos)
    .forEach(s => {
      if (!byZone.has(s.zoneName)) byZone.set(s.zoneName, new Map());
      const rows = byZone.get(s.zoneName);
      if (!rows.has(s.row)) rows.set(s.row, []);
      rows.get(s.row).push(s);
    });
  const lbl = (s) => `${s.row}-${pad(s.n)}`;
  const parts = [];
  for (const [zn, rows] of byZone) {
    const out = [];
    for (const [, seats] of rows) {
      let run = [seats[0]];
      const flush = () => { out.push(run.length === 1 ? lbl(run[0]) : run.length === 2 ? `${lbl(run[0])}, ${lbl(run[1])}` : `${lbl(run[0])}…${lbl(run[run.length - 1])} (${run.length})`); };
      for (let i = 1; i < seats.length; i++) {
        const p = run[run.length - 1], c = seats[i];
        if (c.seg === p.seg && c.pos === p.pos + 1) run.push(c); else { flush(); run = [c]; }
      }
      flush();
    }
    parts.push(`${zn} ${out.join(", ")}`);
  }

}

function supaErr(error) {

  else if (m === "no_session") e.code = "no_session";
  else if (m === "already_open") e.code = "already_open";
  else if (m.startsWith("refund_too_big:")) { e.code = "refund_too_big"; e.paid = +m.split(":")[1] || 0; }
  else if (error && error.code === "23503") e.code = "has_money";
  else if (error && error.code === "23505") { e.code = "conflict"; e.seats = []; }
  else if (error && (error.code === "42501" || /row-level security/i.test(m))) e.code = "denied";

}

/* ---------- Auto allocation ---------- */
function segmentsFor(type, zonePref, exclude) {
  const blocked = blockedSet(), segs = [];
  const ok = (s) => {
    if (S.seatOwner.has(s.id) || blocked.has(s.id) || exclude.has(s.id)) return false;
    const t = seatType(s.id);
    if (type === "vip") return t === "vip";
    if (type === "acc") return t === "acc" || t === "normal";
    return t === "normal";
  };
  for (const z of S.layout.zones) {
    if (zonePref !== "any" && z.id !== zonePref) continue;
    for (const row of z.rowsArr) {
      let cur = [], prev = null;
      for (const s of row.seats) {
        const good = ok(s);
        if (!good || (prev && (s.seg !== prev.seg || s.pos !== prev.pos + 1))) { if (cur.length) segs.push({ z, seats: cur }); cur = []; }
        if (good) cur.push(s);
        prev = s;
      }
      if (cur.length) segs.push({ z, seats: cur });
    }
  }
  return segs;
}
function windowScore(z, w) {
  const ideal = Math.round((z.rowsArr.length - 1) * 0.4), len = w[0].rowLen;
  const mid = (w[0].pos + w[w.length - 1].pos) / 2, centre = (len - 1) / 2;
  return Math.abs(w[0].ri - ideal) + Math.abs(mid - centre) / len * 8 + z.zi * 4;
}
function bestWindow(segs, n, needAcc) {
  let best = null;
  for (const sg of segs) {
    for (let i = 0; i + n <= sg.seats.length; i++) {
      const w = sg.seats.slice(i, i + n);
      if (needAcc && !w.some(s => seatType(s.id) === "acc")) continue;
      const sc = windowScore(sg.z, w);
      if (!best || sc < best.sc) best = { sc, w };
    }
  }
  return best;
}
function suggest(n, zonePref, type) {
  const one = bestWindow(segmentsFor(type, zonePref, new Set()), n, type === "acc");
  if (one) return { ids: one.w.map(s => s.id), split: false };
  const picked = new Set(); let remaining = n, guard = 0;
  while (remaining > 0 && guard++ < 200) {
    const segs = segmentsFor(type, zonePref, picked);
    if (!segs.length) break;
    const k = Math.min(remaining, Math.max(...segs.map(s => s.seats.length)));
    const b = bestWindow(segs, k, false);
    if (!b) break;
    b.w.forEach(s => picked.add(s.id)); remaining -= k;
  }
  return { ids: [...picked], split: true };
}

/* ---------- Venue plan editor ---------- */
function openVenue() {
  const o = $("venueOverlay");
  const zs = S.venue.zones.map(z => `<div class="zone-cfg">
    <div class="field"><label for="vz-${z.id}-name">Nome da zona</label><input id="vz-${z.id}-name" value="${esc(z.name)}"></div>
    <div class="field"><label for="vz-${z.id}-rows">Filas (uma por linha, do palco para trás)</label>
    <textarea id="vz-${z.id}-rows" class="mono" rows="${Math.min(10, (z.rows || []).length + 1)}" spellcheck="false">${esc((z.rows || []).map(r => `${r.label}: ${r.items}`).join("\n"))}</textarea></div></div>`).join("");
  o.innerHTML = `<div class="card" role="dialog" aria-label="Planta da sala"><div class="card-head"><h3>Planta da sala</h3></div>
    <p class="small muted" style="margin:0">Cada linha descreve uma fila da esquerda para a direita, como na planta. <span class="mono">18-2:2</span> são os lugares 18 a 2 de 2 em 2; <span class="mono">20-1</span> são os lugares 20 a 1; cada <span class="mono">_</span> é um espaço vazio (corredor).<br>Exemplo: <span class="mono">A: 18-2:2 _ _ 1-17:2</span></p>
    ${zs}
    <p class="small" style="margin:0;color:var(--warn)" id="vz-warn"></p>
    <div class="row-btns"><button class="btn primary sm" data-act="venue-save" type="button">Guardar planta</button><button class="btn ghost sm" data-act="venue-cancel" type="button">Cancelar</button></div></div>`;
  o.hidden = false; saveVenue.confirmed = false;
}
async function saveVenue() {
  const w = $("vz-warn"); let zones;
  try {
    const seen = new Set();
    zones = S.venue.zones.map(z => {
      const rows = $(`vz-${z.id}-rows`).value.split(/\n/).map(l => l.trim()).filter(Boolean).map(l => {
        const m = l.match(/^([A-Za-z]{1,3})\s*:\s*(.+)$/);
        if (!m) throw new Error(`a linha "${l}" deve começar pela letra da fila e dois pontos`);
        const label = m[1].toUpperCase();
        if (seen.has(z.id + label)) throw new Error(`a fila ${label} aparece duas vezes em ${z.name}`);
        seen.add(z.id + label);
        try { if (!parseRow(m[2]).some(n => n != null)) throw new Error("não tem lugares"); } catch (e) { throw new Error(`fila ${label}: ${e.message}`); }
        return { label, items: m[2].trim().replace(/\s+/g, " ") };
      });
      return { id: z.id, name: $(`vz-${z.id}-name`).value.trim() || z.name, rows };
    });
  } catch (e) { w.textContent = "Não foi possível ler a planta: " + e.message + "."; return; }
  const lay = buildLayout({ zones });
  const orphan = []; S.bookings.forEach(b => (b.seats || []).forEach(id => { if (!lay.idx.has(id)) orphan.push(id); }));
  if (orphan.length && !saveVenue.confirmed) { w.textContent = `Atenção: ${orphan.length} lugares reservados neste evento deixariam de existir. Clique em Guardar planta outra vez para confirmar.`; saveVenue.confirmed = true; return; }
  saveVenue.confirmed = false;
  S.venue = { ...S.venue, zones };
  $("venueOverlay").hidden = true; renderAll();
  await run(() => S.store.saveVenue(S.venue), "Planta da sala guardada.");
}

/* ---------- Tickets ---------- */
/* w = roll width, print = printable width, h = fixed ticket length (every ticket has the same size, so the printer cuts each one at the same length) */
const PAPERS = { "80": { w: 80, print: 72, h: 150, name: "80 mm" }, "58": { w: 58, print: 48, h: 100, name: "58 mm" } };
const DPMM = 8; /* 203 dpi thermal heads */
const paperOf = () => { const e = curEvent(); return e && PAPERS[e.paper] ? e.paper : "80"; };
const firstPos = (b) => { const s = S.layout.idx.get((b.seats || [])[0]); return s ? s.zi * 1e4 + s.ri * 100 + s.pos : 1e9; };
async function processLogo(file) {
  const url = URL.createObjectURL(file);
  let img; try { img = await loadImage(url); } finally { URL.revokeObjectURL(url); }
  const r = Math.min(1, 576 / img.width, 300 / img.height), w = Math.max(1, Math.round(img.width * r)), h = Math.max(1, Math.round(img.height * r));
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h);
  for (let i = 0; i < d.data.length; i += 4) { const l = 0.299 * d.data[i] + 0.587 * d.data[i + 1] + 0.114 * d.data[i + 2]; d.data[i] = d.data[i + 1] = d.data[i + 2] = l; }
  x.putImageData(d, 0, 0);
  let data = c.toDataURL("image/png"); if (data.length > 180000) data = c.toDataURL("image/jpeg", 0.85);
  return data;
}
async function ensureTickets(ev, b) {
  const seats = b.seats || [];
  if (S.store.serverTickets) return (b.tickets || []).filter(t => seats.includes(t.s));
  const have = new Map((b.tickets || []).filter(t => seats.includes(t.s)).map(t => [t.s, t.c]));
  let changed = have.size !== (b.tickets || []).length;
  for (const id of seats) if (!have.has(id)) { let c; do { c = makeCode(ev.id, id); } while (S.ticketIndex.has(c)); have.set(id, c); changed = true; }
  const tickets = seats.map(id => ({ s: id, c: have.get(id) }));
  if (changed) await S.store.updateBooking(ev.id, b.id, { tickets });
  return tickets;
}
function wrapLines(x, text, maxW, maxLines) {
  const words = String(text || "").split(/\s+/).filter(Boolean), lines = []; let cur = "";
  for (const w of words) { const t = cur ? cur + " " + w : w; if (x.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; } }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) { lines.length = maxLines; let l = lines[maxLines - 1]; while (l.length > 1 && x.measureText(l + "…").width > maxW) l = l.slice(0, -1); lines[maxLines - 1] = l + "…"; }
  return lines;
}
function drawTicket(t, paperKey) {

  const c = document.createElement("canvas"); c.width = W; c.height = px(2200);
  const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.fillStyle = "#000"; x.strokeStyle = "#000"; x.textAlign = "center";
  const dash = (y) => { x.save(); x.setLineDash([px(10), px(7)]); x.lineWidth = Math.max(2, px(2)); x.beginPath(); x.moveTo(px(6), y); x.lineTo(W - px(6), y); x.stroke(); x.restore(); };
  let y = px(6);

  x.font = `700 ${px(40)}px "Bricolage Grotesque", "IBM Plex Sans", sans-serif`;
  for (const line of wrapLines(x, t.eventName, W - px(20), 2)) { y += px(44); x.fillText(line, W / 2, y); }
  x.font = `500 ${px(25)}px "IBM Plex Sans", sans-serif`; y += px(38); x.fillText(t.dateLine, W / 2, y);
  y += px(24); dash(y);
  x.font = `700 ${px(28)}px "IBM Plex Sans", sans-serif`; y += px(46); x.fillText(t.zone.toUpperCase().split("").join(" "), W / 2, y);
  const cl = W * 0.28, cr = W * 0.72;
  x.font = `600 ${px(21)}px "IBM Plex Sans", sans-serif`; y += px(38); x.fillText("FILA", cl, y); x.fillText("LUGAR", cr, y);
  x.font = `700 ${px(104)}px "IBM Plex Sans", sans-serif`; y += px(100); x.fillText(t.row, cl, y); x.fillText(pad(t.n), cr, y);
  x.save(); x.lineWidth = Math.max(2, px(2)); x.beginPath(); x.moveTo(W / 2, y - px(118)); x.lineTo(W / 2, y + px(4)); x.stroke(); x.restore();
  if (t.type !== "normal") {

    x.fillRect((W - tw) / 2, y, tw, px(38)); x.fillStyle = "#fff"; x.fillText(label, W / 2, y + px(27)); x.fillStyle = "#000"; y += px(38);
  }
  y += px(26); dash(y);

      <div><span>Despesas</span><b>${eur(T.expenses_cents)}</b><small>&nbsp;</small></div><div class="${bal(T) < 0 ? "is-neg" : "is-pos"}"><span>Saldo</span><b>${eur(bal(T))}</b><small>&nbsp;</small></div></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Evento</th><th class="num">Sócio</th><th class="num">Não sócio</th><th class="num">Convid.</th><th class="num">Vendido</th><th class="num">Recebido</th><th class="num">Despesas</th><th class="num">Saldo</th></tr></thead><tbody>
      ${rows.map(x => `<tr><td class="mono">${fmtDate(x.date, { day: "2-digit", month: "2-digit", year: "2-digit" })}</td><td>${esc(x.name)}</td><td class="num">${x.socio}</td><td class="num">${x.nao_socio}</td><td class="num">${x.convidado}</td><td class="num">${eur(x.sold_cents)}</td><td class="num">${eur(x.received_cents - x.refunded_cents)}</td><td class="num">${eur(x.expenses_cents)}</td><td class="num ${bal(x) < 0 ? "neg" : ""}">${eur(bal(x))}</td></tr>`).join("")}
      <tr class="tot"><td></td><td>Total</td><td class="num">${T.socio}</td><td class="num">${T.nao_socio}</td><td class="num">${T.convidado}</td><td class="num">${eur(T.sold_cents)}</td><td class="num">${eur(T.received_cents - T.refunded_cents)}</td><td class="num">${eur(T.expenses_cents)}</td><td class="num">${eur(bal(T))}</td></tr></tbody></table></div>
      <div class="tbl-wrap"><table class="tbl" style="max-width:420px"><thead><tr><th>Método</th><th class="num">Recebido (líquido)</th></tr></thead><tbody>${Object.keys(METHODS).map(m => `<tr><td>${METHODS[m]}</td><td class="num">${eur(byM[m])}</td></tr>`).join("")}</tbody></table></div>
      <div class="row-btns"><button class="btn sm" data-act="rep-exp" type="button">Exportar resumo</button><button class="btn sm" data-act="rep-exp-mov" type="button">Exportar movimentos</button></div>`;
  } catch (e) { const b = $("repBody"); if (b) b.textContent = errMsg(e); }
}
async function exportReport(kind) {
  const d = S.repData; if (!d) return;
  if (kind === "sum") {
    const rows = [["Data", "Hora", "Evento", "Bilhetes", "Sócio", "Não sócio", "Convidado", "Vendido (€)", "Recebido (€)", "Devolvido (€)", "Despesas (€)", "Saldo (€)"]];
    d.rows.forEach(x => rows.push([x.date, x.time, x.name, x.tickets, x.socio, x.nao_socio, x.convidado, money(x.sold_cents), money(x.received_cents), money(x.refunded_cents), money(x.expenses_cents), money(x.received_cents - x.refunded_cents - x.expenses_cents)]));
    saveCsv(`resumo-financeiro-${S.rep.from}-a-${S.rep.to}.csv`, rows); return;
  }
  const names = new Map(d.rows.map(x => [x.event_id, x.name]));
  const xs = await S.store.finance.periodExpenses(d.rows.map(x => x.event_id));
  const rows = [["Data", "Evento", "Movimento", "Descrição", "Método/Categoria", "Valor (€)", "Registado por"]];
  d.pays.forEach(p => rows.push([dt(p.created_at), names.get(p.event_id) || "", p.amount_cents < 0 ? "Reembolso" : "Pagamento", p.booking_name, METHODS[p.method], money(p.amount_cents), p.created_by]));
  xs.forEach(x => rows.push([x.date, names.get(x.event_id) || "", "Despesa", x.description, x.category, money(-x.amount_cents), x.created_by]));
  saveCsv(`movimentos-${S.rep.from}-a-${S.rep.to}.csv`, rows);
}

async function exportCsv(kind) {
  const ev = curEvent(); if (!ev) return;
  let rows;
  if (kind === "list") {
    rows = [["Nome", "Contacto", "N.º lugares", "Lugares", "Notas", "Entradas", "Hora de entrada", ...(canFinance() ? ["Total (€)", "Pago (€)", "Em falta (€)"] : [])]];
    S.bookings.slice().sort((a, b) => a.name.localeCompare(b.name, "pt")).forEach(b => { const k = enteredCount(b), n = (b.seats || []).length; rows.push([b.name, b.contact, n, formatSeats(b.seats || []), b.notes, k === n ? "Sim" : k ? `${k}/${n}` : "Não", b.checkedAt ? new Date(b.checkedAt).toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" }) : "", ...(canFinance() ? [money(bookingTotal(b)), money(bookingPaid(b)), money(Math.max(0, bookingDue(b)))] : [])]); });
  } else {
    rows = [["Zona", "Fila", "Lugar", "Tipo de lugar", "Estado", "Nome", "Contacto", "Código do bilhete", "Bilhete", "Preço (€)"]];
    const blocked = blockedSet();
    S.layout.zones.forEach(z => z.rowsArr.forEach(r => r.seats.forEach(s => {
      const b = S.bookings.find(x => x.id === S.seatOwner.get(s.id));
      const tk = b && (b.tickets || []).find(t => t.s === s.id);
      rows.push([z.name, s.row, pad(s.n), TYPE_NAMES[seatType(s.id)], b ? (seatIn(b, s.id) ? "Entrou" : "Reservado") : blocked.has(s.id) ? "Bloqueado" : "Livre", b ? b.name : "", b ? b.contact : "", tk ? tk.c : "", b ? CATS[(b.cats || {})[s.id] || "nao_socio"] : "", b ? money((b.prices || {})[s.id] || 0) : ""]);
    })));
  }
  const csv = "﻿" + rows.map(r => r.map(csvCell).join(";")).join("\r\n");
  const slug = (ev.name || "evento").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase();
  const filename = `${kind === "list" ? "reservas" : "lugares"}-${slug}-${ev.date}.csv`;
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000); toast("Ficheiro guardado na pasta de transferências.");
}

/* ---------- Boot ---------- */
function pickDefaultEvent() {
  if (S.eventId && S.events.some(e => e.id === S.eventId)) return S.eventId;
  const t = todayISO(); const up = S.events.find(e => (e.date || "") >= t);
  return up ? up.id : (S.events.length ? S.events[S.events.length - 1].id : null);
}
function start(store) {
  S.store = store;
  store.onVenue((v) => {
    if (v && Array.isArray(v.zones) && v.zones.length && v.zones.every(z => Array.isArray(z.rows))) {
      if (!S.pendingVenue) S.venue = { zones: v.zones, types: v.types || {} };
    }
    renderAll();
  }, (err) => toast(errMsg(err)));
  store.onEvents((list) => {
    S.events = list.sort((a, b) => ((a.date || "") + (a.time || "")).localeCompare((b.date || "") + (b.time || "")));
    S.events.forEach((e, i) => { if (S.pendingBlocked[e.id]) S.events[i] = { ...e, blocked: S.pendingBlocked[e.id] }; });
    S.ready = true;
    const want = pickDefaultEvent();
    if (want !== S.eventId || !S.unsubB) selectEvent(want); else renderAll();
  }, (err) => toast(errMsg(err)));
}

/* ---------- Sign-in and team ---------- */
const sb = (window.supabase && SUPABASE_URL.startsWith("https://")) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } }) : null;
const G = { mode: "in", msg: "", busy: false };
function gate(html) { $("gateCard").innerHTML = html; $("gate").hidden = false; }
function renderLogin() {
  const up = G.mode === "up";
  gate(`<h2>Bilheteira <span>União Académica de Avintes</span></h2>
    <p class="muted" style="margin:0">${up ? "Crie a sua conta. Depois de confirmar o email, o responsável tem de a autorizar na lista da equipa." : "Entre com a conta da equipa."}</p>
    <form id="loginForm" class="panel" style="gap:10px">
      <div class="field"><label for="lg-email">Email</label><input id="lg-email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="lg-pass">Palavra-passe</label><input id="lg-pass" type="password" autocomplete="${up ? "new-password" : "current-password"}" minlength="6" required></div>
      ${G.msg ? `<p class="small" style="margin:0">${G.msg}</p>` : ""}
      <div class="row-btns"><button class="btn primary" type="submit" ${G.busy ? "disabled" : ""}>${up ? "Criar conta" : "Entrar"}</button>
      <button class="btn ghost sm" type="button" id="lg-switch">${up ? "Já tenho conta" : "Criar conta"}</button></div>
    </form>`);
  $("lg-switch").onclick = () => { G.mode = up ? "in" : "up"; G.msg = ""; renderLogin(); };
  $("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const email = $("lg-email").value.trim().toLowerCase(), password = $("lg-pass").value;
    G.busy = true; G.msg = ""; renderLogin(); $("lg-email").value = email;
    if (up) {
      const r = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
      G.busy = false;
      if (r.error) G.msg = esc(r.error.message);
      else if (r.data.session) { enter(r.data.session); return; }
      else { G.mode = "in"; G.msg = `Enviámos um email de confirmação para <b>${esc(email)}</b>. Clique no link do email (se abrir uma página de erro, ignore: a conta fica confirmada) e depois entre aqui.`; }
      renderLogin(); $("lg-email").value = email; return;
    }
    const r = await sb.auth.signInWithPassword({ email, password });
    G.busy = false;
    if (r.error) { G.msg = /confirm/i.test(r.error.message) ? "Ainda não confirmou o email. Abra o link que recebeu e tente de novo." : "Email ou palavra-passe incorretos."; renderLogin(); $("lg-email").value = email; return; }
    enter(r.data.session);
  };
}
async function enter(session) {
  const email = (session.user.email || "").toLowerCase();
  const r = await sb.from("staff").select("email,is_admin").eq("email", email).maybeSingle();
  if (r.error || !r.data) {
    gate(`<h2>Conta por autorizar</h2><p style="margin:0">A conta <b>${esc(email)}</b> ainda não faz parte da equipa da bilheteira. Peça a um responsável que a adicione em <b>Equipa</b>.</p>
      <div class="row-btns"><button class="btn sm" type="button" id="gt-retry">Tentar de novo</button><button class="btn ghost sm" type="button" id="gt-out">Sair</button></div>`);
    $("gt-retry").onclick = () => enter(session); $("gt-out").onclick = () => sb.auth.signOut().then(() => location.reload());
    return;
  }
  S.me = { email, admin: !!r.data.is_admin };
  S.readOnly = !S.me.admin;
  document.body.classList.toggle("role-user", !S.me.admin);
  if (!S.me.admin) S.tab = "scan";
  $("who").innerHTML = `<span class="role-pill ${S.me.admin ? "admin" : ""}">${S.me.admin ? "Admin" : "User"}</span><span>${esc(email)}</span>${S.me.admin ? `<button class="btn ghost sm" type="button" data-act="cash-open-ui" id="cashBtn">Caixa</button><button class="btn ghost sm" type="button" data-act="rep-open">Relatórios</button><button class="btn ghost sm" type="button" data-act="staff-open">Equipa</button>` : ""}<button class="btn ghost sm" type="button" id="logout">Sair</button>`;
  $("logout").onclick = () => sb.auth.signOut().then(() => location.reload());
  $("gate").hidden = true;
  if (!S.store) start(makeSupaStore(sb));
  if (S.me.admin && S.store.finance && !S.unsubC) S.unsubC = S.store.finance.onCash((c) => { S.cash = c; renderCashBtn(); if (!$("cashOverlay").hidden && !S.cashResult) keepFocus(() => renderCash(false)); keepFocus(renderPanel); });
  if (S.eventId && canFinance() && !S.unsubF) { const id = S.eventId; S.unsubF = S.store.finance.onEvent(id, (d) => { S.payments = d.payments; S.expenses = d.expenses; keepFocus(() => { renderTabs(); renderPanel(); }); }); }
}
async function renderStaff() {
  const o = $("staffOverlay");
  const r = await sb.from("staff").select("email,is_admin").order("email");
  const roleSel = (x) => `<select data-staff-role="${esc(x.email)}" aria-label="Perfil de ${esc(x.email)}"><option value="admin" ${x.is_admin ? "selected" : ""}>Admin</option><option value="user" ${x.is_admin ? "" : "selected"}>User</option></select>`;
  const rows = (r.data || []).map(x => `<div class="staff-row"><span>${esc(x.email)}</span>
    ${x.email === S.me.email ? `<span class="role-pill admin">Admin</span><span class="small muted">(você)</span>` : `${roleSel(x)}<button class="btn ghost sm" type="button" data-staff-del="${esc(x.email)}">Remover</button>`}</div>`).join("");
  o.innerHTML = `<div class="card" role="dialog" aria-label="Equipa"><div class="card-head"><h3>Equipa</h3></div>
    <p class="small muted" style="margin:0">Só os emails desta lista entram na bilheteira. Cada pessoa cria a sua conta no ecrã de entrada com o mesmo email.<br><b>Admin</b>: acesso total. <b>User</b>: apenas valida entradas nos eventos.</p>
    <div>${rows}</div>
    <div class="grid2" style="align-items:end"><div class="field"><label for="st-email">Adicionar email</label><input id="st-email" type="email" placeholder="nome@exemplo.pt"></div>
    <div class="field"><label for="st-role">Perfil</label><select id="st-role"><option value="user" selected>User — só valida entradas</option><option value="admin">Admin — acesso total</option></select></div></div>
    <div class="row-btns"><button class="btn primary sm" type="button" id="st-add">Adicionar</button><button class="btn ghost sm" type="button" id="st-close">Fechar</button></div></div>`;
  o.hidden = false;
  $("st-close").onclick = () => { o.hidden = true; };
  $("st-add").onclick = async () => {
    const email = $("st-email").value.trim().toLowerCase(); if (!/^\S+@\S+\.\S+$/.test(email)) { toast("Escreva um email válido."); return; }
    const x = await sb.from("staff").insert({ email, is_admin: $("st-role").value === "admin" });
    if (x.error) toast(x.error.code === "23505" ? "Esse email já está na equipa." : "Não foi possível adicionar."); else { toast("Adicionado à equipa."); renderStaff(); }
  };
  o.querySelectorAll("[data-staff-role]").forEach(sel => sel.onchange = async () => {
    const x = await sb.from("staff").update({ is_admin: sel.value === "admin" }).eq("email", sel.dataset.staffRole);
    if (x.error) { toast("Não foi possível alterar o perfil."); renderStaff(); } else toast(`${sel.dataset.staffRole} passou a ${sel.value === "admin" ? "Admin" : "User"}. A alteração aplica-se quando essa pessoa voltar a abrir a bilheteira.`);
  });
  o.querySelectorAll("[data-staff-del]").forEach(b => b.onclick = async () => {
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Confirmar remoção"; b.classList.add("danger"); return; }
    const x = await sb.from("staff").delete().eq("email", b.dataset.staffDel);
    if (x.error) toast("Não foi possível remover."); else renderStaff();
  });
}
document.addEventListener("click", (e) => { if (e.target.closest('[data-act="staff-open"]')) renderStaff(); });

renderAll();
(async () => {
  if (!sb) {
    S.demo = true; $("gate").hidden = true;
    const b = $("banner"); b.textContent = "Modo de demonstração: falta configurar a ligação à base de dados. As alterações não ficam guardadas."; b.hidden = false;
    start(makeMemStore(DEMO)); return;
  }
  const { data } = await sb.auth.getSession();
  if (data && data.session) enter(data.session); else renderLogin();
})();
})();
</script>
